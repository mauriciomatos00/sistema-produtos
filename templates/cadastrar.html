<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Produto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 20px 0;
            box-sizing: border-box;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        a {
            margin-left: 10px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Cadastrar Produto</h1>

    <form method="POST">

        <label>Nome do produto:</label>

        <input
            type="text"
            name="nome"
            required
        >

        <label>Preço:</label>

        <input
            type="number"
            name="preco"
            step="0.01"
            min="0"
            required
        >

        <button type="submit">
            Cadastrar
        </button>

        <a href="/">
            Voltar
        </a>

    </form>

</div>

</body>
</html>
